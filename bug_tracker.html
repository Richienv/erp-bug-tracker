<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Bug Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f7;
    --surface: #f2f0ec;
    --border: #e8e5df;
    --text: #1a1a1a;
    --muted: #8c8a85;
    --accent: #d97706;
    --accent-light: #fef3c7;
    --white: #ffffff;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Inter', sans-serif;
    --radius: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; -webkit-font-smoothing: antialiased; }

  /* Layout */
  .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* Top Nav */
  .topnav { display: flex; align-items: center; gap: 0; padding: 0 24px; height: 52px; border-bottom: 1px solid var(--border); background: var(--white); flex-shrink: 0; position: sticky; top: 0; z-index: 10; }
  .brand { font-size: 15px; font-weight: 600; color: var(--text); margin-right: 20px; white-space: nowrap; letter-spacing: -0.2px; }
  .nav-tabs { display: flex; align-items: center; gap: 2px; flex: 1; }
  .nav-tab { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border: none; background: none; font-family: var(--sans); font-size: 13px; color: var(--muted); cursor: pointer; border-radius: var(--radius); border-bottom: 2px solid transparent; transition: color 0.12s; height: 52px; }
  .nav-tab:hover { color: var(--text); }
  .nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
  .tab-count { font-size: 11px; background: var(--surface); color: var(--muted); padding: 1px 6px; border-radius: 999px; font-family: var(--sans); }
  .nav-tab.active .tab-count { background: var(--accent-light); color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 8px; margin-left: auto; }

  /* Search + Controls */
  .search-wrap { display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: var(--radius); padding: 0 10px; background: var(--white); }
  .search-wrap input { background: none; border: none; outline: none; color: var(--text); font-size: 13px; padding: 6px 0; width: 170px; font-family: var(--sans); }
  .search-wrap input::placeholder { color: var(--muted); }
  select { background: var(--white); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 6px 10px; font-size: 13px; font-family: var(--sans); outline: none; cursor: pointer; }
  select:focus { border-color: var(--accent); }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid transparent; font-family: var(--sans); transition: all 0.12s; white-space: nowrap; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #b45309; }
  .btn-ghost { background: none; color: var(--muted); border-color: var(--border); }
  .btn-ghost:hover { color: var(--text); background: var(--surface); }
  .btn-danger { background: none; color: #dc2626; border-color: #fecaca; }
  .btn-danger:hover { background: #fff1f1; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }

  /* (Stats row removed — counts live in nav tabs) */

  /* Bug table */
  .table-wrap { flex: 1; overflow-y: auto; }
  .table-header { display: grid; grid-template-columns: 80px 1fr 130px 90px 110px 20px; gap: 12px; padding: 9px 28px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--bg); position: sticky; top: 0; }
  .bug-row { display: grid; grid-template-columns: 80px 1fr 130px 90px 110px 20px; gap: 12px; padding: 11px 28px; border-bottom: 1px solid var(--border); align-items: center; cursor: pointer; transition: background 0.1s; }
  .bug-row:hover { background: var(--surface); }
  .bug-id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .bug-title-text { font-size: 13px; font-weight: 500; color: var(--text); }
  .bug-module { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .s-Open { background: #fff1f1; color: #dc2626; }
  .s-InProgress { background: #fffbeb; color: #d97706; }
  .s-Fixed { background: #eff6ff; color: #2563eb; }
  .s-Verified { background: #f0fdf4; color: #16a34a; }
  .s-Closed { background: #f5f5f5; color: #6b7280; }
  .bug-reporter { font-size: 12px; color: var(--muted); }
  .bug-date { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .bug-attach { color: var(--muted); display: flex; align-items: center; }

  /* Side panel */
  .panel-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.15); z-index: 40; }
  .side-panel { position: fixed; top: 0; right: 0; width: 420px; height: 100vh; background: var(--white); border-left: 1px solid var(--border); z-index: 50; display: flex; flex-direction: column; transform: translateX(100%); transition: transform 0.2s ease; }
  .side-panel.open { transform: translateX(0); }
  .panel-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .panel-id { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .panel-close { background: none; border: none; font-size: 18px; color: var(--muted); cursor: pointer; line-height: 1; padding: 2px 4px; font-family: var(--sans); }
  .panel-close:hover { color: var(--text); }
  .panel-body { flex: 1; overflow-y: auto; padding: 20px; }
  .panel-title { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 8px; line-height: 1.4; }
  .panel-module { display: inline-block; font-size: 11px; background: var(--surface); color: var(--muted); padding: 2px 9px; border-radius: 999px; margin-bottom: 20px; }
  .panel-section { margin-bottom: 18px; }
  .panel-lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 6px; }
  .panel-val { font-size: 13px; color: var(--text); line-height: 1.6; white-space: pre-wrap; }
  .panel-val.empty { color: var(--muted); font-style: italic; }
  .panel-imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .panel-img-lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); margin-bottom: 6px; }
  .panel-img-frame { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; min-height: 80px; display: flex; align-items: center; justify-content: center; }
  .panel-img-frame img { width: 100%; height: auto; max-height: 200px; object-fit: contain; cursor: zoom-in; }
  .panel-img-empty { font-size: 11px; color: var(--muted); padding: 16px; }
  .panel-actions { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; align-items: center; }
  .del-confirm { width: 100%; background: #fff1f1; border: 1px solid #fecaca; border-radius: var(--radius); padding: 8px 12px; font-size: 12px; color: #dc2626; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* Empty state */
  .empty-state { text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty-state-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.3; }
  .empty-state-text { font-size: 15px; margin-bottom: 4px; color: var(--text); font-weight: 500; }
  .empty-state-sub { font-size: 13px; }

  /* Modal overlay */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.25); display: flex; align-items: flex-start; justify-content: center; z-index: 100; padding: 48px 20px; overflow-y: auto; }
  .modal { background: var(--white); border-radius: var(--radius-lg); width: 100%; max-width: 560px; padding: 28px; box-shadow: 0 8px 32px rgba(0,0,0,0.10); }
  .modal-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { }
  .form-group.full { grid-column: 1/-1; }
  .form-group label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 5px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; background: var(--white); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; font-size: 13px; font-family: var(--sans); outline: none; transition: border-color 0.15s; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  .form-group textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
  .img-upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .upload-zone { border: 1px dashed var(--border); border-radius: var(--radius); padding: 12px; text-align: center; transition: border-color 0.15s; background: var(--bg); }
  .upload-zone:hover { border-color: var(--accent); }
  .upload-zone-lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 8px; }
  .upload-zone img { width: 100%; max-height: 140px; object-fit: contain; border-radius: 6px; margin-bottom: 6px; }
  .upload-zone input[type=file] { font-size: 11px; color: var(--muted); width: 100%; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border); }

  /* Lightbox */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 200; cursor: zoom-out; }
  .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: var(--radius); box-shadow: 0 24px 64px rgba(0,0,0,0.4); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="app">
  <!-- Top Nav -->
  <nav class="topnav">
    <div class="brand">ERP Bugs</div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="setStatusFilter('')" id="nav-all">All <span class="tab-count" id="cnt-all">0</span></button>
      <button class="nav-tab" onclick="setStatusFilter('Open')" id="nav-open">Open <span class="tab-count" id="cnt-open">0</span></button>
      <button class="nav-tab" onclick="setStatusFilter('In Progress')" id="nav-prog">In Progress <span class="tab-count" id="cnt-prog">0</span></button>
      <button class="nav-tab" onclick="setStatusFilter('Fixed')" id="nav-fix">Fixed <span class="tab-count" id="cnt-fix">0</span></button>
      <button class="nav-tab" onclick="setStatusFilter('Verified')" id="nav-ver">Verified <span class="tab-count" id="cnt-ver">0</span></button>
      <button class="nav-tab" onclick="setStatusFilter('Closed')" id="nav-closed">Closed <span class="tab-count" id="cnt-clo">0</span></button>
    </div>
    <div class="nav-right">
      <div class="search-wrap">
        <svg width="13" height="13" fill="none" stroke="#8c8a85" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="search-input" placeholder="Search..." oninput="applyFilters()">
      </div>
      <select id="filter-module" onchange="applyFilters()">
        <option value="">All modules</option>
        <option>Finance / Invoice</option><option>Finance / COA</option><option>Finance / Journal</option>
        <option>Finance / AR Aging</option><option>Finance / AP Aging</option><option>Finance / Bank Recon</option>
        <option>Finance / Petty Cash</option><option>Finance / Debit Note</option><option>Finance / Credit Note</option>
        <option>Finance / Credit Limit</option><option>Inventory</option><option>Purchase</option>
        <option>Sales</option><option>HR</option><option>Settings</option><option>Dashboard</option><option>Auth</option>
      </select>
      <button class="btn btn-primary" onclick="openForm()">+ New Bug</button>
    </div>
  </nav>

  <!-- Main -->
  <div class="main">
    <div class="table-wrap">
      <div class="table-header">
        <span>ID</span><span>Title / Module</span><span>Status</span><span>Reporter</span><span>Date</span><span></span>
      </div>
      <div id="bug-list"></div>
    </div>
  </div>
</div>

<!-- Side Panel -->
<div class="panel-backdrop hidden" id="panel-backdrop" onclick="closePanel()"></div>
<div class="side-panel" id="side-panel">
  <div class="panel-header">
    <span class="panel-id" id="panel-bug-id"></span>
    <button class="panel-close" onclick="closePanel()">×</button>
  </div>
  <div class="panel-body" id="panel-body"></div>
  <div class="panel-actions" id="panel-actions"></div>
</div>

<!-- New/Edit Modal -->
<div class="overlay hidden" id="modal-overlay" onclick="overlayClick(event)">
  <div class="modal" id="modal">
    <div class="modal-title">
      <span id="modal-title-text">Log New Bug</span>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕ Close</button>
    </div>
    <div class="form-grid">
      <div class="form-group">
        <label>Reported by</label>
        <select id="f-reporter">
          <option>Richie</option><option>Darren</option><option>Raymond</option>
        </select>
      </div>
      <div class="form-group">
        <label>Date reported</label>
        <input type="date" id="f-date">
      </div>
      <div class="form-group full">
        <label>Module / Page</label>
        <select id="f-module">
          <option value="">Select module...</option>
          <option>Finance / Invoice</option><option>Finance / COA</option><option>Finance / Journal</option>
          <option>Finance / AR Aging</option><option>Finance / AP Aging</option><option>Finance / Bank Recon</option>
          <option>Finance / Petty Cash</option><option>Finance / Debit Note</option><option>Finance / Credit Note</option>
          <option>Finance / Credit Limit</option><option>Inventory</option><option>Purchase</option>
          <option>Sales</option><option>HR</option><option>Settings</option><option>Dashboard</option><option>Auth</option>
        </select>
      </div>
      <div class="form-group full">
        <label>Bug title</label>
        <input type="text" id="f-title" placeholder="Short and specific — e.g. Credit limit not enforced on PUT /invoice">
      </div>
      <div class="form-group full">
        <label>Description — what happened, expected behaviour, steps to reproduce</label>
        <textarea id="f-desc" style="min-height:90px" placeholder="1. Go to...&#10;2. Do...&#10;3. Expected: ...  Actual: ..."></textarea>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="f-status">
          <option>Open</option><option>In Progress</option><option>Fixed</option><option>Verified</option><option>Closed</option>
        </select>
      </div>
      <div class="form-group">
        <label>Date resolved</label>
        <input type="date" id="f-resolved">
      </div>
      <div class="form-group full">
        <label>Fix description (file · function · what changed — fill after fixing)</label>
        <textarea id="f-fix" style="min-height:70px" placeholder="e.g. Added credit limit check in invoiceService.ts createInvoice() — throws 422 if balance > limit. db push done."></textarea>
      </div>
      <div class="form-group">
        <label>Verified by</label>
        <select id="f-verified-by">
          <option value="">—</option><option>Richie</option><option>Darren</option><option>Raymond</option>
        </select>
      </div>
      <div class="form-group">
        <label>Notes / links</label>
        <input type="text" id="f-notes" placeholder="Related bug IDs, Notion, Vercel link...">
      </div>
      <div class="form-group full">
        <label>Screenshots (before & after)</label>
        <div class="img-upload-grid">
          <div class="upload-zone" id="before-zone">
            <div class="upload-zone-lbl">Before</div>
            <div id="before-preview"></div>
            <input type="file" accept="image/*" onchange="handleImg(event,'before')" id="before-input">
          </div>
          <div class="upload-zone" id="after-zone">
            <div class="upload-zone-lbl">After</div>
            <div id="after-preview"></div>
            <input type="file" accept="image/*" onchange="handleImg(event,'after')" id="after-input">
          </div>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitForm()" id="submit-btn">Log Bug</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox hidden" id="lightbox" onclick="this.classList.add('hidden')">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
const BUGS_KEY = 'erp-bugs-v3';
const REPORTERS = ['Richie','Darren','Raymond'];
const STATUSES = ['Open','In Progress','Fixed','Verified','Closed'];

let state = { bugs: [], filter: { q:'', status:'', module:'' }, panelBugId: null, panelImgs: null, editId: null, formBefore: null, formAfter: null, confirmDelId: null };

// Storage
async function loadBugs() { try { const r = await window.storage.get(BUGS_KEY); return r ? JSON.parse(r.value) : []; } catch(e) { return []; } }
async function saveBugs() { try { await window.storage.set(BUGS_KEY, JSON.stringify(state.bugs)); } catch(e) {} }
async function saveImg(id, t, data) { try { await window.storage.set('bug-img-'+id+'-'+t, data); } catch(e) {} }
async function loadImgs(id) { let b=null,a=null; try{const r=await window.storage.get('bug-img-'+id+'-before');if(r)b=r.value;}catch(e){} try{const r=await window.storage.get('bug-img-'+id+'-after');if(r)a=r.value;}catch(e){} return{before:b,after:a}; }
async function delImgs(id) { try{await window.storage.delete('bug-img-'+id+'-before');}catch(e){} try{await window.storage.delete('bug-img-'+id+'-after');}catch(e){} }

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(d){if(!d)return'—';try{return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return d;}}
function sc(s){return(s||'').replace(/ /g,'');}
function nextId(){const m=state.bugs.reduce((a,b)=>{const n=parseInt((b.id||'').replace('ERP-',''));return isNaN(n)?a:Math.max(a,n);},0);return'ERP-'+String(m+1).padStart(3,'0');}

function getStats(){
  const s={tot:0,open:0,prog:0,fix:0,ver:0,clo:0};
  state.bugs.forEach(b=>{s.tot++;if(b.status==='Open')s.open++;else if(b.status==='In Progress')s.prog++;else if(b.status==='Fixed')s.fix++;else if(b.status==='Verified')s.ver++;else if(b.status==='Closed')s.clo++;});
  return s;
}
function filteredBugs(){
  const {q,status,module}=state.filter;
  return state.bugs.filter(b=>{
    if(q&&!(b.title+' '+b.description+' '+b.id+' '+(b.reportedBy||'')).toLowerCase().includes(q.toLowerCase()))return false;
    if(status&&b.status!==status)return false;
    if(module&&b.module!==module)return false;
    return true;
  }).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
}

function updateStats(){
  const s=getStats();
  document.getElementById('cnt-all').textContent=s.tot;
  document.getElementById('cnt-open').textContent=s.open;
  document.getElementById('cnt-prog').textContent=s.prog;
  document.getElementById('cnt-fix').textContent=s.fix;
  document.getElementById('cnt-ver').textContent=s.ver;
  document.getElementById('cnt-clo').textContent=s.clo;
}

function renderList(){
  const bugs=filteredBugs();
  const list=document.getElementById('bug-list');
  if(!bugs.length){
    list.innerHTML=`<div class="empty-state"><div class="empty-state-icon">◎</div><div class="empty-state-text">${state.bugs.length===0?'No bugs logged yet':'No bugs match your filters'}</div><div class="empty-state-sub">${state.bugs.length===0?'Click "+ New Bug" to start tracking':'Try adjusting the filters'}</div></div>`;
    return;
  }
  list.innerHTML=bugs.map(bug=>renderBugRow(bug)).join('');
}

function renderBugRow(bug){
  const cls=sc(bug.status);
  const attachIcon=bug.hasBeforeImg||bug.hasAfterImg
    ?`<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>`
    :'';
  return `<div class="bug-row" id="row-${bug.id}" onclick="openPanel('${bug.id}')">
    <div class="bug-id">${esc(bug.id)}</div>
    <div>
      <div class="bug-title-text">${esc(bug.title)}</div>
      <div class="bug-module">${esc(bug.module||'—')}</div>
    </div>
    <div><span class="badge s-${cls}">${bug.status}</span></div>
    <div class="bug-reporter">${esc(bug.reportedBy)}</div>
    <div class="bug-date">${fmt(bug.createdAt)}</div>
    <div class="bug-attach">${attachIcon}</div>
  </div>`;
}

// Nav / filter actions
function setStatusFilter(s){
  state.filter.status=s;
  ['all','open','prog','fix','ver','closed'].forEach(k=>{document.getElementById('nav-'+k)?.classList.remove('active');});
  const map={'':'all','Open':'open','In Progress':'prog','Fixed':'fix','Verified':'ver','Closed':'closed'};
  document.getElementById('nav-'+(map[s]||'all'))?.classList.add('active');
  applyFilters();
}


function applyFilters(){
  state.filter.q=document.getElementById('search-input')?.value||'';
  state.filter.module=document.getElementById('filter-module')?.value||'';
  updateStats();
  renderList();
}

// Side panel
async function openPanel(id){
  state.panelBugId=id;
  state.confirmDelId=null;
  state.panelImgs=null;
  renderPanel();
  document.getElementById('side-panel').classList.add('open');
  document.getElementById('panel-backdrop').classList.remove('hidden');
  const bug=state.bugs.find(b=>b.id===id);
  if(bug&&(bug.hasBeforeImg||bug.hasAfterImg)){
    const imgs=await loadImgs(id);
    state.panelImgs=imgs;
    renderPanel();
  }
}

function closePanel(){
  state.panelBugId=null;
  state.confirmDelId=null;
  state.panelImgs=null;
  document.getElementById('side-panel').classList.remove('open');
  document.getElementById('panel-backdrop').classList.add('hidden');
}

function renderPanel(){
  const id=state.panelBugId;
  if(!id)return;
  const bug=state.bugs.find(b=>b.id===id);
  if(!bug){closePanel();return;}
  const imgs=state.panelImgs;
  const isDel=state.confirmDelId===id;
  const nextS={'Open':'In Progress','In Progress':'Fixed','Fixed':'Verified','Verified':'Closed'}[bug.status];

  document.getElementById('panel-bug-id').textContent=bug.id;

  let body=`
    <div class="panel-title">${esc(bug.title)}</div>
    ${bug.module?`<div class="panel-module">${esc(bug.module)}</div>`:''}
    <div class="panel-section">
      <div class="panel-lbl">Description</div>
      <div class="panel-val${bug.description?'':' empty'}">${bug.description?esc(bug.description):'Not provided'}</div>
    </div>
    <div class="panel-section">
      <div class="panel-lbl">Fix notes</div>
      <div class="panel-val${bug.fixDescription?'':' empty'}">${bug.fixDescription?esc(bug.fixDescription):'Not yet fixed'}</div>
    </div>`;

  if(bug.verifiedBy){
    body+=`<div class="panel-section">
      <div class="panel-lbl">Verified by</div>
      <div class="panel-val">${esc(bug.verifiedBy)}${bug.resolvedAt?' · '+fmt(bug.resolvedAt):''}</div>
    </div>`;
  }
  if(bug.notes){
    body+=`<div class="panel-section">
      <div class="panel-lbl">Notes</div>
      <div class="panel-val">${esc(bug.notes)}</div>
    </div>`;
  }
  if(bug.hasBeforeImg||bug.hasAfterImg){
    body+=`<div class="panel-section"><div class="panel-lbl">Screenshots</div><div class="panel-imgs">`;
    if(bug.hasBeforeImg){
      body+=`<div><div class="panel-img-lbl">Before</div><div class="panel-img-frame">`;
      body+=imgs&&imgs.before?`<img src="${imgs.before}" onclick="showLightbox('before')" alt="Before">`:`<div class="panel-img-empty">Loading…</div>`;
      body+=`</div></div>`;
    }
    if(bug.hasAfterImg){
      body+=`<div><div class="panel-img-lbl">After</div><div class="panel-img-frame">`;
      body+=imgs&&imgs.after?`<img src="${imgs.after}" onclick="showLightbox('after')" alt="After">`:`<div class="panel-img-empty">Loading…</div>`;
      body+=`</div></div>`;
    }
    body+=`</div></div>`;
  }
  document.getElementById('panel-body').innerHTML=body;

  let actions='';
  if(nextS) actions+=`<button class="btn btn-ghost btn-sm" onclick="quickStatus('${id}','${nextS}')">→ ${esc(nextS)}</button>`;
  actions+=`<button class="btn btn-ghost btn-sm" onclick="editBug('${id}')">Edit</button>`;
  if(!isDel){
    actions+=`<button class="btn btn-danger btn-sm" onclick="confirmDel('${id}')">Delete</button>`;
  } else {
    actions+=`<div class="del-confirm" style="margin-top:0">Delete ${esc(id)} permanently?
      <button class="btn btn-danger btn-sm" onclick="doDelete('${id}')">Yes, delete</button>
      <button class="btn btn-ghost btn-sm" onclick="cancelDel()">Cancel</button>
    </div>`;
  }
  document.getElementById('panel-actions').innerHTML=actions;
}

// Status quick change
async function quickStatus(id,ns){
  const bug=state.bugs.find(b=>b.id===id);if(!bug)return;
  bug.status=ns;
  if((ns==='Verified'||ns==='Closed')&&!bug.resolvedAt)bug.resolvedAt=new Date().toISOString().split('T')[0];
  await saveBugs();updateStats();renderList();
  if(state.panelBugId===id)renderPanel();
}

// Delete
function confirmDel(id){state.confirmDelId=id;renderPanel();}
function cancelDel(){state.confirmDelId=null;renderPanel();}
async function doDelete(id){
  state.bugs=state.bugs.filter(b=>b.id!==id);
  state.confirmDelId=null;
  await delImgs(id);await saveBugs();updateStats();renderList();
  closePanel();
}

// Form
function openForm(){
  state.editId=null;state.formBefore=null;state.formAfter=null;
  document.getElementById('modal-title-text').textContent='Log New Bug';
  document.getElementById('submit-btn').textContent='Log Bug';
  document.getElementById('f-reporter').value='Richie';
  document.getElementById('f-date').value=new Date().toISOString().split('T')[0];
  document.getElementById('f-module').value='';
  document.getElementById('f-title').value='';
  document.getElementById('f-desc').value='';
  document.getElementById('f-status').value='Open';
  document.getElementById('f-resolved').value='';
  document.getElementById('f-fix').value='';
  document.getElementById('f-verified-by').value='';
  document.getElementById('f-notes').value='';
  resetImgPreviews();
  document.getElementById('modal-overlay').classList.remove('hidden');
  document.getElementById('f-title').focus();
}

function editBug(id){
  const bug=state.bugs.find(b=>b.id===id);if(!bug)return;
  state.editId=id;state.formBefore=null;state.formAfter=null;
  document.getElementById('modal-title-text').textContent='Edit · '+id;
  document.getElementById('submit-btn').textContent='Save Changes';
  document.getElementById('f-reporter').value=bug.reportedBy||'Richie';
  document.getElementById('f-date').value=bug.createdAt||'';
  document.getElementById('f-module').value=bug.module||'';
  document.getElementById('f-title').value=bug.title||'';
  document.getElementById('f-desc').value=bug.description||'';
  document.getElementById('f-status').value=bug.status||'Open';
  document.getElementById('f-resolved').value=bug.resolvedAt||'';
  document.getElementById('f-fix').value=bug.fixDescription||'';
  document.getElementById('f-verified-by').value=bug.verifiedBy||'';
  document.getElementById('f-notes').value=bug.notes||'';
  resetImgPreviews();
  // Load existing images
  if(bug.hasBeforeImg||bug.hasAfterImg){
    loadImgs(id).then(imgs=>{
      if(imgs.before){state.formBefore=imgs.before;showImgPreview('before',imgs.before);}
      if(imgs.after){state.formAfter=imgs.after;showImgPreview('after',imgs.after);}
    });
  }
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal(){document.getElementById('modal-overlay').classList.add('hidden');}
function overlayClick(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}

function resetImgPreviews(){
  ['before','after'].forEach(t=>{
    const p=document.getElementById(t+'-preview');if(p)p.innerHTML='';
    const i=document.getElementById(t+'-input');if(i){i.style.display='';i.value='';}
  });
}

function showImgPreview(t,src){
  const p=document.getElementById(t+'-preview');
  const inp=document.getElementById(t+'-input');
  if(p)p.innerHTML=`<img src="${src}" style="width:100%;max-height:120px;object-fit:contain;border-radius:6px;margin-bottom:6px"><button class="btn btn-ghost btn-sm" onclick="removeImg('${t}')">Remove</button>`;
  if(inp)inp.style.display='none';
}

function handleImg(e,t){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    const data=ev.target.result;
    if(t==='before')state.formBefore=data;else state.formAfter=data;
    showImgPreview(t,data);
  };
  r.readAsDataURL(f);
}

function removeImg(t){
  if(t==='before')state.formBefore=null;else state.formAfter=null;
  const p=document.getElementById(t+'-preview');if(p)p.innerHTML='';
  const i=document.getElementById(t+'-input');if(i){i.style.display='';i.value='';}
}

async function submitForm(){
  const title=document.getElementById('f-title')?.value?.trim();
  if(!title){alert('Bug title is required.');return;}
  const bug={
    id:state.editId||nextId(),
    title,
    reportedBy:document.getElementById('f-reporter').value,
    module:document.getElementById('f-module').value,
    status:document.getElementById('f-status').value,
    createdAt:document.getElementById('f-date').value||new Date().toISOString().split('T')[0],
    description:document.getElementById('f-desc').value||'',
    fixDescription:document.getElementById('f-fix').value||'',
    verifiedBy:document.getElementById('f-verified-by').value||'',
    resolvedAt:document.getElementById('f-resolved').value||'',
    notes:document.getElementById('f-notes').value||'',
    hasBeforeImg:!!state.formBefore,
    hasAfterImg:!!state.formAfter,
  };
  if(state.editId){
    const i=state.bugs.findIndex(b=>b.id===state.editId);
    if(i>=0)state.bugs[i]=bug;
    if(!state.formBefore)try{await window.storage.delete('bug-img-'+bug.id+'-before');}catch(e){}
    if(!state.formAfter)try{await window.storage.delete('bug-img-'+bug.id+'-after');}catch(e){}
  } else {
    state.bugs.unshift(bug);
  }
  if(state.formBefore)await saveImg(bug.id,'before',state.formBefore);
  if(state.formAfter)await saveImg(bug.id,'after',state.formAfter);
  await saveBugs();
  const wasPanel=state.panelBugId===bug.id;
  closeModal();updateStats();renderList();
  if(wasPanel){state.panelImgs=null;await openPanel(bug.id);}
}

function showLightbox(t){
  const imgs=state.panelImgs;if(!imgs)return;
  const src=t==='before'?imgs.before:imgs.after;if(!src)return;
  document.getElementById('lightbox-img').src=src;
  document.getElementById('lightbox').classList.remove('hidden');
}

async function init(){
  state.bugs=await loadBugs();
  updateStats();renderList();
}
init();
</script>
</body>
</html>
