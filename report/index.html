<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report a Bug</title>
<link rel="stylesheet" href="../shared/styles.css">
<style>
/* ============================================
   Reporter View — Page Styles
   ============================================ */

/* ---- Identity Picker ---- */
.identity-picker {
  position: fixed;
  inset: 0;
  background: var(--bg-secondary);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 5000;
  transition: opacity 0.3s ease;
}

.identity-picker.hidden {
  opacity: 0;
  pointer-events: none;
}

.identity-picker h1 {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 8px;
  color: var(--text-primary);
}

.identity-picker p {
  font-size: 16px;
  color: var(--text-secondary);
  margin-bottom: 36px;
}

.identity-cards {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
}

.identity-card {
  width: 180px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px 20px;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.25s ease, transform 0.25s ease;
}

.identity-card:hover {
  box-shadow: var(--shadow-lg);
  transform: translateY(-4px);
}

.identity-card .icon {
  font-size: 36px;
  margin-bottom: 12px;
  display: block;
}

.identity-card .name {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
}

/* ---- Header ---- */
.page-header {
  max-width: 640px;
  margin: 0 auto;
  padding: 24px 24px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.greeting {
  font-size: 24px;
  font-weight: 600;
  color: var(--text-primary);
  cursor: pointer;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
}

.greeting::after {
  content: '';
  display: inline-block;
  width: 0;
  height: 0;
  margin-left: 8px;
  border-left: 5px solid transparent;
  border-right: 5px solid transparent;
  border-top: 5px solid var(--text-tertiary);
  vertical-align: middle;
}

.switch-dropdown {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  min-width: 160px;
  z-index: 1000;
  opacity: 0;
  transform: translateY(-4px);
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.switch-dropdown.open {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.switch-dropdown button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 10px 16px;
  font-size: 15px;
  font-family: var(--font);
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-primary);
  transition: background 0.15s ease;
}

.switch-dropdown button:first-child {
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
}

.switch-dropdown button:last-child {
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
}

.switch-dropdown button:hover {
  background: var(--bg-secondary);
}

.switch-dropdown button.active {
  color: var(--blue);
  font-weight: 600;
}

/* ---- Form ---- */
.form-area {
  max-width: 640px;
  margin: 0 auto;
  padding: 20px 24px 0;
}

.form-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  padding: 20px;
}

.title-input {
  width: 100%;
  font-size: 17px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-family: var(--font);
  color: var(--text-primary);
  background: var(--bg);
  outline: none;
  transition: border-color 0.2s ease;
}

.title-input::placeholder {
  color: var(--text-tertiary);
}

.title-input:focus {
  border-color: var(--blue);
}

/* ---- Module Picker Pill ---- */
.module-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 14px;
  padding: 10px 16px;
  font-size: 15px;
  font-family: var(--font);
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  cursor: pointer;
  color: var(--text-tertiary);
  transition: border-color 0.2s ease, color 0.2s ease;
  position: relative;
}

.module-pill.selected {
  color: var(--text-primary);
  border-color: var(--blue);
}

.module-pill svg {
  flex-shrink: 0;
}

/* ---- Module Popover (desktop) ---- */
.module-popover {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  width: 280px;
  max-height: 400px;
  overflow-y: auto;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  z-index: 2000;
  opacity: 0;
  transform: translateY(-4px);
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.module-popover.open {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.module-section-header {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-tertiary);
  padding: 12px 16px 4px;
}

.module-item {
  display: flex;
  align-items: center;
  height: 44px;
  padding: 0 16px;
  font-size: 15px;
  color: var(--text-primary);
  cursor: pointer;
  transition: background 0.15s ease;
}

.module-item:hover {
  background: var(--bg-secondary);
}

.module-item:last-child {
  border-radius: 0 0 var(--radius) var(--radius);
}

/* ---- Module Bottom Sheet (mobile) ---- */
.module-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  z-index: 3000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.module-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.module-sheet {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg);
  border-radius: 20px 20px 0 0;
  max-height: 70vh;
  overflow-y: auto;
  z-index: 3001;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  padding-bottom: env(safe-area-inset-bottom, 20px);
}

.module-sheet.open {
  transform: translateY(0);
}

.module-sheet-handle {
  width: 36px;
  height: 5px;
  background: var(--border);
  border-radius: 3px;
  margin: 10px auto 6px;
}

.module-sheet .module-section-header {
  padding: 14px 20px 4px;
}

.module-sheet .module-item {
  padding: 0 20px;
  height: 48px;
}

/* ---- Screenshot Drop Zone ---- */
.drop-zone {
  margin-top: 14px;
  height: 150px;
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: border-color 0.2s ease, background 0.2s ease;
  position: relative;
  overflow: hidden;
}

.drop-zone.dragover {
  border-color: var(--blue);
  background: var(--blue-bg);
}

.drop-zone .drop-label {
  font-size: 14px;
  color: var(--text-tertiary);
  text-align: center;
  padding: 0 16px;
}

.drop-zone .drop-hint {
  font-size: 12px;
  color: var(--text-tertiary);
  opacity: 0.7;
}

.drop-zone .drop-icon {
  color: var(--text-tertiary);
}

.drop-zone.has-image .drop-content {
  display: none;
}

.drop-zone .preview-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: calc(var(--radius) - 2px);
}

.drop-zone .remove-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.55);
  color: #fff;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  line-height: 1;
  transition: background 0.15s ease;
  z-index: 2;
}

.drop-zone .remove-btn:hover {
  background: rgba(0, 0, 0, 0.75);
}

/* ---- Submit Button ---- */
.submit-btn {
  width: 100%;
  height: 48px;
  margin-top: 14px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  transition: background 0.2s ease, opacity 0.2s ease, transform 0.1s ease;
}

.submit-btn:hover:not(:disabled) {
  background: #0066DD;
}

.submit-btn:active:not(:disabled) {
  transform: scale(0.98);
}

.submit-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* ---- Feed Section ---- */
.feed-area {
  max-width: 640px;
  margin: 0 auto;
  padding: 28px 24px 40px;
}

.feed-heading {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 14px;
}

/* ---- Bug Card ---- */
.bug-card {
  background: var(--bg);
  border: 1px solid #E5E5EA;
  box-shadow: var(--shadow-sm);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 8px;
  cursor: pointer;
  position: relative;
  transition: box-shadow 0.2s ease;
}

.bug-card:hover {
  box-shadow: var(--shadow-md);
}

.bug-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.bug-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text-primary);
  flex: 1;
  min-width: 0;
  word-wrap: break-word;
}

.bug-time {
  font-size: 13px;
  color: var(--text-tertiary);
  flex-shrink: 0;
  white-space: nowrap;
}

.bug-card-bottom {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}

.module-tag {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  background: var(--gray-bg);
  color: var(--text-secondary);
  padding: 2px 8px;
  border-radius: 4px;
}

.status-badge {
  transition: background-color 0.3s ease, color 0.3s ease;
}

.status-badge::before {
  transition: background-color 0.3s ease;
}

.bug-thumb {
  position: absolute;
  bottom: 16px;
  right: 16px;
  width: 40px;
  height: 40px;
  border-radius: 6px;
  object-fit: cover;
  border: 1px solid var(--border-light);
}

/* ---- Card Expand ---- */
.bug-card-expand {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.bug-card.expanded .bug-card-expand {
  max-height: 600px;
}

.expand-inner {
  padding-top: 14px;
}

.expand-screenshot {
  width: 100%;
  max-height: 300px;
  object-fit: contain;
  border-radius: 10px;
  cursor: pointer;
  display: block;
}

.expand-separator {
  height: 1px;
  background: var(--border-light);
  margin: 14px 0;
}

.expand-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-tertiary);
  margin-bottom: 6px;
}

.expand-notes {
  font-size: 14px;
  color: var(--text-primary);
  line-height: 1.5;
}

.expand-notes.empty {
  font-style: italic;
  color: var(--text-tertiary);
}

/* ---- New Card Animation ---- */
@keyframes cardFadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.bug-card.new-card {
  animation: cardFadeIn 0.2s ease forwards;
}

/* ---- Sync Error ---- */
.sync-error {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  font-size: 13px;
  color: var(--orange);
}

.sync-error .sync-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--orange);
  flex-shrink: 0;
}

.sync-error button {
  background: none;
  border: none;
  color: var(--blue);
  font-size: 13px;
  font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  margin-left: 4px;
  padding: 0;
}

.sync-error button:hover {
  text-decoration: underline;
}

/* ---- Empty State ---- */
.empty-state {
  text-align: center;
  padding: 60px 20px;
}

.empty-state .empty-icon {
  color: var(--text-tertiary);
}

.empty-state .empty-title {
  font-size: 17px;
  font-weight: 500;
  margin-top: 16px;
  color: var(--text-primary);
}

.empty-state .empty-desc {
  font-size: 14px;
  color: var(--text-tertiary);
  margin-top: 4px;
}

/* ---- Lightbox Image ---- */
.lightbox img {
  max-width: 90vw;
  max-height: 90vh;
  border-radius: 8px;
  object-fit: contain;
}

/* ---- Mobile ---- */
@media (max-width: 639px) {
  .drop-zone {
    height: 120px;
  }

  .page-header {
    padding: 20px 20px 0;
  }

  .form-area {
    padding: 16px 20px 0;
  }

  .feed-area {
    padding: 24px 20px 40px;
  }

  .identity-card {
    width: 150px;
    padding: 24px 16px;
  }

  .identity-card .name {
    font-size: 20px;
  }
}
</style>
</head>
<body>

<!-- Identity Picker -->
<div class="identity-picker" id="identity-picker">
  <h1>Who are you?</h1>
  <p>Select your identity to start reporting bugs.</p>
  <div class="identity-cards" id="identity-cards"></div>
</div>

<!-- Offline Banner -->
<div class="offline-banner" id="offline-banner">Offline — changes will sync when reconnected</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="" alt="Screenshot preview">
</div>

<!-- Main Page -->
<div id="main-view" style="display:none;">
  <!-- Header -->
  <header class="page-header">
    <div class="greeting" id="greeting" tabindex="0">
      <span id="greeting-text"></span>
      <div class="switch-dropdown" id="switch-dropdown"></div>
    </div>
  </header>

  <!-- Capture Form -->
  <div class="form-area">
    <div class="form-card">
      <input type="text" class="title-input" id="title-input" placeholder="What went wrong?" autocomplete="off">

      <div style="position:relative;">
        <button class="module-pill" id="module-pill" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span id="module-pill-text">Select module...</span>
        </button>

        <!-- Desktop popover -->
        <div class="module-popover" id="module-popover"></div>
      </div>

      <!-- Mobile bottom sheet -->
      <div class="module-overlay" id="module-overlay"></div>
      <div class="module-sheet" id="module-sheet">
        <div class="module-sheet-handle"></div>
        <div id="module-sheet-content"></div>
      </div>

      <!-- Screenshot drop zone -->
      <div class="drop-zone" id="drop-zone">
        <div class="drop-content">
          <svg class="drop-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
          <div class="drop-label">Drop, paste, or tap to add screenshot</div>
          <div class="drop-hint">1 screenshot per report</div>
        </div>
      </div>
      <input type="file" id="file-input" accept="image/*" hidden>

      <button class="submit-btn" id="submit-btn" disabled>Report Bug</button>
    </div>
  </div>

  <!-- Your Bugs Feed -->
  <div class="feed-area">
    <div class="feed-heading">Your Bugs</div>
    <div id="feed"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../shared/config.js"></script>
<script>
(() => {
  'use strict';

  /* ============================================
     State
     ============================================ */
  let currentName = localStorage.getItem('reporter-name') || '';
  let bugs = [];
  let expandedId = null;
  let selectedModule = '';
  let screenshotFile = null;
  let screenshotDataURL = null;
  let isSubmitting = false;

  /* ============================================
     DOM refs
     ============================================ */
  const $ = (id) => document.getElementById(id);
  const pickerEl        = $('identity-picker');
  const pickerCards     = $('identity-cards');
  const mainView        = $('main-view');
  const greetingEl      = $('greeting');
  const greetingText    = $('greeting-text');
  const switchDropdown  = $('switch-dropdown');
  const titleInput      = $('title-input');
  const modulePill      = $('module-pill');
  const modulePillText  = $('module-pill-text');
  const modulePopover   = $('module-popover');
  const moduleOverlay   = $('module-overlay');
  const moduleSheet     = $('module-sheet');
  const moduleSheetContent = $('module-sheet-content');
  const dropZone        = $('drop-zone');
  const fileInput       = $('file-input');
  const submitBtn       = $('submit-btn');
  const feedEl          = $('feed');
  const lightbox        = $('lightbox');
  const lightboxImg     = $('lightbox-img');
  const offlineBanner   = $('offline-banner');

  /* ============================================
     Utility
     ============================================ */
  const isMobile = () => window.innerWidth < 640;

  /* ============================================
     1. Identity Picker
     ============================================ */
  const emojis = { Richie: '\uD83D\uDE80', Darren: '\uD83D\uDD25', Raymond: '\u26A1' };

  function buildPicker() {
    pickerCards.innerHTML = REPORTERS.map(name => `
      <div class="identity-card" data-name="${esc(name)}">
        <span class="icon">${emojis[name] || '\uD83D\uDC64'}</span>
        <span class="name">${esc(name)}</span>
      </div>
    `).join('');

    pickerCards.addEventListener('click', (e) => {
      const card = e.target.closest('.identity-card');
      if (!card) return;
      currentName = card.dataset.name;
      localStorage.setItem('reporter-name', currentName);
      pickerEl.classList.add('hidden');
      setTimeout(() => { pickerEl.style.display = 'none'; }, 300);
      initMainView();
    });
  }

  function buildSwitchDropdown() {
    switchDropdown.innerHTML = REPORTERS.map(name => `
      <button data-name="${esc(name)}" class="${name === currentName ? 'active' : ''}">${esc(name)}</button>
    `).join('');
  }

  /* ---- Switch dropdown toggle ---- */
  let dropdownOpen = false;

  greetingEl.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdownOpen = !dropdownOpen;
    switchDropdown.classList.toggle('open', dropdownOpen);
  });

  switchDropdown.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const newName = btn.dataset.name;
    if (newName !== currentName) {
      currentName = newName;
      localStorage.setItem('reporter-name', currentName);
      greetingText.textContent = 'Hey ' + currentName;
      buildSwitchDropdown();
      loadBugs();
      setupRealtime();
    }
    dropdownOpen = false;
    switchDropdown.classList.remove('open');
  });

  document.addEventListener('click', () => {
    if (dropdownOpen) {
      dropdownOpen = false;
      switchDropdown.classList.remove('open');
    }
  });

  /* ============================================
     2. Module Picker
     ============================================ */
  function buildModuleList(container, isMobileSheet) {
    let html = '';
    for (const [group, modules] of Object.entries(MODULES)) {
      html += `<div class="module-section-header">${esc(group.toUpperCase())}</div>`;
      modules.forEach(mod => {
        html += `<div class="module-item" data-module="${esc(mod)}">${esc(mod)}</div>`;
      });
    }
    container.innerHTML = html;
  }

  function selectModule(mod) {
    selectedModule = mod;
    modulePillText.textContent = mod;
    modulePill.classList.add('selected');
    closeModulePicker();
  }

  function openModulePicker() {
    if (isMobile()) {
      buildModuleList(moduleSheetContent, true);
      moduleOverlay.classList.add('open');
      moduleSheet.classList.add('open');
    } else {
      buildModuleList(modulePopover, false);
      modulePopover.classList.add('open');
    }
  }

  function closeModulePicker() {
    modulePopover.classList.remove('open');
    moduleOverlay.classList.remove('open');
    moduleSheet.classList.remove('open');
  }

  modulePill.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = modulePopover.classList.contains('open') || moduleSheet.classList.contains('open');
    if (isOpen) {
      closeModulePicker();
    } else {
      openModulePicker();
    }
  });

  moduleOverlay.addEventListener('click', closeModulePicker);

  /* Delegate click on module items */
  [modulePopover, moduleSheetContent].forEach(container => {
    container.addEventListener('click', (e) => {
      const item = e.target.closest('.module-item');
      if (!item) return;
      selectModule(item.dataset.module);
    });
  });

  document.addEventListener('click', (e) => {
    if (!modulePill.contains(e.target) && !modulePopover.contains(e.target)) {
      modulePopover.classList.remove('open');
    }
  });

  /* ============================================
     3. Screenshot Drop Zone
     ============================================ */
  function handleFile(file) {
    if (!file || !file.type.startsWith('image/')) return;
    screenshotFile = file;
    const reader = new FileReader();
    reader.onload = (e) => {
      screenshotDataURL = e.target.result;
      renderDropZone();
    };
    reader.readAsDataURL(file);
  }

  function clearScreenshot() {
    screenshotFile = null;
    screenshotDataURL = null;
    fileInput.value = '';
    renderDropZone();
  }

  function renderDropZone() {
    if (screenshotDataURL) {
      dropZone.classList.add('has-image');
      // Keep drop-content hidden via CSS, add preview
      let img = dropZone.querySelector('.preview-img');
      let rmBtn = dropZone.querySelector('.remove-btn');
      if (!img) {
        img = document.createElement('img');
        img.className = 'preview-img';
        dropZone.appendChild(img);
      }
      img.src = screenshotDataURL;
      if (!rmBtn) {
        rmBtn = document.createElement('button');
        rmBtn.className = 'remove-btn';
        rmBtn.innerHTML = '&times;';
        rmBtn.type = 'button';
        rmBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          clearScreenshot();
        });
        dropZone.appendChild(rmBtn);
      }
    } else {
      dropZone.classList.remove('has-image');
      const img = dropZone.querySelector('.preview-img');
      const rmBtn = dropZone.querySelector('.remove-btn');
      if (img) img.remove();
      if (rmBtn) rmBtn.remove();
    }
  }

  /* Drag events */
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.classList.remove('dragover');
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    handleFile(file);
  });

  /* Click to upload */
  dropZone.addEventListener('click', () => {
    if (!screenshotDataURL) fileInput.click();
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) handleFile(fileInput.files[0]);
  });

  /* Paste (document-level) */
  document.addEventListener('paste', (e) => {
    const items = e.clipboardData?.items;
    if (!items) return;
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        handleFile(item.getAsFile());
        break;
      }
    }
  });

  /* ============================================
     4. Submit Button State
     ============================================ */
  titleInput.addEventListener('input', () => {
    submitBtn.disabled = !titleInput.value.trim() || isSubmitting;
  });

  /* ============================================
     5. Form Submission
     ============================================ */
  submitBtn.addEventListener('click', handleSubmit);

  async function handleSubmit() {
    const title = titleInput.value.trim();
    if (!title || isSubmitting) return;

    isSubmitting = true;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    let screenshot_url = null;

    try {
      /* Upload screenshot if exists */
      if (screenshotFile) {
        const fileName = `bugs/${Date.now()}.png`;
        const { data: uploadData, error: uploadError } = await sb.storage
          .from('screenshots')
          .upload(fileName, screenshotFile, { contentType: screenshotFile.type, upsert: false });

        if (uploadError) throw uploadError;

        const { data: urlData } = sb.storage
          .from('screenshots')
          .getPublicUrl(fileName);

        screenshot_url = urlData.publicUrl;
      }

      /* Insert bug */
      const bugData = {
        title,
        module: selectedModule || null,
        reporter: currentName,
        screenshot_url,
        status: 'Open',
        severity: 'Medium'
      };

      const { data, error } = await sb
        .from('bugs')
        .insert(bugData)
        .select()
        .single();

      if (error) throw error;

      showToast('Bug reported');

      /* Optimistic: add to feed */
      if (data) {
        bugs.unshift(data);
        renderFeed(data.id);
      }

      /* Clear form */
      titleInput.value = '';
      selectedModule = '';
      modulePillText.textContent = 'Select module...';
      modulePill.classList.remove('selected');
      clearScreenshot();
      submitBtn.disabled = true;

    } catch (err) {
      console.error('Submit error:', err);
      showToast(err.message || 'Failed to report bug', true);
      /* Retry logic for network failures */
      retrySubmit(title, selectedModule, screenshotFile, 0);
    } finally {
      isSubmitting = false;
      submitBtn.textContent = 'Report Bug';
      submitBtn.disabled = !titleInput.value.trim();
    }
  }

  /* ---- Retry with exponential backoff ---- */
  async function retrySubmit(title, mod, file, attempt) {
    if (attempt >= 3) return;
    const delay = [1000, 2000, 4000][attempt];
    await new Promise(r => setTimeout(r, delay));

    try {
      let screenshot_url = null;
      if (file) {
        const fileName = `bugs/${Date.now()}.png`;
        const { data: uploadData, error: uploadError } = await sb.storage
          .from('screenshots')
          .upload(fileName, file, { contentType: file.type, upsert: false });
        if (uploadError) throw uploadError;
        const { data: urlData } = sb.storage.from('screenshots').getPublicUrl(fileName);
        screenshot_url = urlData.publicUrl;
      }

      const { data, error } = await sb
        .from('bugs')
        .insert({ title, module: mod || null, reporter: currentName, screenshot_url, status: 'Open', severity: 'Medium' })
        .select()
        .single();

      if (error) throw error;

      showToast('Bug reported (retry succeeded)');
      if (data) {
        bugs.unshift(data);
        renderFeed(data.id);
      }
    } catch (err) {
      retrySubmit(title, mod, file, attempt + 1);
    }
  }

  /* ============================================
     6. Feed Rendering
     ============================================ */
  async function loadBugs() {
    const { data, error } = await sb
      .from('bugs')
      .select('*')
      .eq('reporter', currentName)
      .order('created_at', { ascending: false });

    if (error) {
      console.error('Load error:', error);
      showToast('Failed to load bugs', true);
      return;
    }

    bugs = data || [];
    expandedId = null;
    renderFeed();
  }

  function renderFeed(newCardId) {
    if (bugs.length === 0) {
      feedEl.innerHTML = `
        <div class="empty-state">
          <svg class="empty-icon" width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="24" cy="24" r="18"/>
            <path d="M16 20c0-2 2-4 4-4s4 2 4 4"/>
            <path d="M24 20c0-2 2-4 4-4s4 2 4 4"/>
            <path d="M16 30c2 3 5 4 8 4s6-1 8-4"/>
            <path d="M33 15l4-4m-4 0l4 4" stroke-width="2"/>
          </svg>
          <p class="empty-title">No bugs reported yet</p>
          <p class="empty-desc">When you report a bug, it'll show up here with live status updates.</p>
        </div>
      `;
      return;
    }

    feedEl.innerHTML = bugs.map(bug => renderCard(bug, bug.id === newCardId)).join('');

    /* Attach card event listeners */
    feedEl.querySelectorAll('.bug-card').forEach(card => {
      card.addEventListener('click', (e) => {
        /* Don't toggle if clicking lightbox trigger or retry */
        if (e.target.closest('.expand-screenshot') || e.target.closest('.sync-error button')) return;
        const id = card.dataset.id;
        expandedId = expandedId === id ? null : id;
        renderFeed();
      });
    });

    /* Attach lightbox triggers */
    feedEl.querySelectorAll('[data-lightbox]').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        openLightbox(el.dataset.lightbox);
      });
    });
  }

  function renderCard(bug, isNew) {
    const sc = STATUS_COLORS[bug.status] || STATUS_COLORS['Open'];
    const isExpanded = expandedId === String(bug.id);

    let thumbHtml = '';
    if (bug.screenshot_url && !isExpanded) {
      thumbHtml = `<img class="bug-thumb" src="${esc(bug.screenshot_url)}" alt="" data-lightbox="${esc(bug.screenshot_url)}">`;
    }

    let expandHtml = '';
    if (isExpanded) {
      let screenshotSection = '';
      if (bug.screenshot_url) {
        screenshotSection = `
          <img class="expand-screenshot" src="${esc(bug.screenshot_url)}" alt="Screenshot" data-lightbox="${esc(bug.screenshot_url)}">
          <div class="expand-separator"></div>
        `;
      }
      const notesContent = bug.fix_notes
        ? `<div class="expand-notes">${esc(bug.fix_notes)}</div>`
        : `<div class="expand-notes empty">No fix notes yet</div>`;

      expandHtml = `
        <div class="expand-inner">
          ${screenshotSection}
          <div class="expand-label">Fix Notes</div>
          ${notesContent}
        </div>
      `;
    }

    const syncHtml = bug._syncError ? `
      <div class="sync-error">
        <span class="sync-dot"></span>
        Not synced
        <button onclick="event.stopPropagation()">Retry</button>
      </div>
    ` : '';

    return `
      <div class="bug-card ${isExpanded ? 'expanded' : ''} ${isNew ? 'new-card' : ''}" data-id="${bug.id}">
        <div class="bug-card-top">
          <div class="bug-title">${esc(bug.title)}</div>
          <div class="bug-time">${timeAgo(bug.created_at)}</div>
        </div>
        <div class="bug-card-bottom">
          ${bug.module ? `<span class="module-tag">${esc(bug.module)}</span>` : ''}
          <span class="badge status-badge" style="background:${sc.bg}; color:${sc.dot};">${esc(bug.status)}</span>
        </div>
        ${thumbHtml}
        ${syncHtml}
        <div class="bug-card-expand">${expandHtml}</div>
      </div>
    `;
  }

  /* ============================================
     7. Real-time Subscription
     ============================================ */
  let channel = null;

  function setupRealtime() {
    if (channel) {
      sb.removeChannel(channel);
    }

    channel = sb.channel('reporter-bugs')
      .on('postgres_changes', {
        event: '*',
        schema: 'public',
        table: 'bugs',
        filter: `reporter=eq.${currentName}`
      }, (payload) => {
        if (payload.eventType === 'UPDATE') {
          const idx = bugs.findIndex(b => b.id === payload.new.id);
          if (idx !== -1) {
            bugs[idx] = { ...bugs[idx], ...payload.new };
            renderFeed();
          }
        }
        if (payload.eventType === 'INSERT') {
          /* Only add if not already present (optimistic) */
          if (!bugs.find(b => b.id === payload.new.id)) {
            bugs.unshift(payload.new);
            renderFeed(payload.new.id);
          }
        }
        if (payload.eventType === 'DELETE') {
          bugs = bugs.filter(b => b.id !== payload.old.id);
          if (expandedId === String(payload.old.id)) expandedId = null;
          renderFeed();
        }
      })
      .subscribe();
  }

  /* ============================================
     8. Lightbox
     ============================================ */
  function openLightbox(src) {
    lightboxImg.src = src;
    lightbox.classList.add('show');
  }

  lightbox.addEventListener('click', () => {
    lightbox.classList.remove('show');
    lightboxImg.src = '';
  });

  /* ============================================
     9. Offline Banner
     ============================================ */
  window.addEventListener('offline', () => {
    offlineBanner.classList.add('show');
  });

  window.addEventListener('online', () => {
    offlineBanner.classList.remove('show');
  });

  /* ============================================
     10. Init
     ============================================ */
  function initMainView() {
    mainView.style.display = 'block';
    greetingText.textContent = 'Hey ' + currentName;
    buildSwitchDropdown();
    loadBugs();
    setupRealtime();
  }

  buildPicker();

  if (currentName) {
    pickerEl.style.display = 'none';
    initMainView();
  }

})();
</script>
</body>
